events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    # homeserver.api - Flask REST API on port 5001
    upstream rest_api {
        server host.docker.internal:5001;
    }

    # homewebsocket.api - WebSocket bridge on port 8765
    upstream websocket_api {
        server host.docker.internal:8765;
    }

    server {
        listen 80;
        server_name localhost _;

        root /usr/share/nginx/html;
        index index.html;

        # WebSocket bridge - proxy to homewebsocket.api on port 8765
        location /ws {
            proxy_pass http://websocket_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # REST API - strips /api prefix before proxying to homeserver.api on port 5001
        location /api {
            rewrite ^/api/?(.*)$ /$1 break;
            proxy_pass http://rest_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA - serve index.html for all other routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

events {
    worker_connections 1024;
}

http {
    # homeserver.api - Flask REST API on port 5001
    upstream rest_api {
        server host.docker.internal:5001;
    }

    # homewebsocket.api - WebSocket bridge on port 8765
    upstream websocket_api {
        server host.docker.internal:8765;
    }

    server {
        listen 80;
        server_name localhost _;  # _ catches the ngrok domain

        # WebSocket bridge - proxy to homewebsocket.api on port 8765
        location /ws {
            proxy_pass http://websocket_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # All other routes - proxy to homeserver.api (Flask REST) on port 5001
        location / {
            proxy_pass http://rest_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

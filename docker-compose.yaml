version: '3.8'

networks:
  home-server:
    driver: bridge
    name: home-server



services:
  mysql:
    image: mysql:latest
    container_name: mysqldb 
    restart: always
    networks:
      - home-server
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: home_server_db
      MYSQL_USER: mbuie
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_user_password
      TZ: America/Vancouver
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    secrets:
      - mysql_root_password
      - mysql_user_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$(cat /run/secrets/mysql_root_password)"]
      interval: 30s
      timeout: 10s
      retries: 5

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    networks:
      - home-server
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME_FILE=/run/secrets/mongo_root_username
      - MONGO_INITDB_ROOT_PASSWORD_FILE=/run/secrets/mongo_root_password
      - TZ=America/Vancouver
    volumes:
      - mongo_data:/data/db
    secrets:
      - mongo_root_username
      - mongo_root_password
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s


  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: always
    networks:
      - home-server
    ports:
      - 1883:1883   # MQTT port
      - 9001:9001   # WebSocket port (optional)
    environment:
      - TZ=America/Vancouver
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    command: mosquitto -c /mosquitto/config/mosquitto.conf

  nodered:
    image: nodered/node-red:latest
    container_name: node-red
    restart: always
    networks:
      - home-server
    ports:
      - 1880:1880
    environment:
      - TZ=America/Vancouver
    depends_on:
      - mosquitto
    volumes:
      - ./node-red/data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:latest
    container_name: nginx-gateway
    restart: always
    networks:
      - home-server
    ports:
      - "8080:80"
    environment:
      - TZ=America/Vancouver
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    command: http --log=stdout --log-level=info --url=${NGROK_API_DOMAIN} localhost:8080
    volumes:
      - ./ngrok/resolv.conf:/etc/resolv.conf:ro
    depends_on:
      - nginx



secrets:
  mongo_root_username:
    file: ./secrets/mongo_root_username.txt
  mongo_root_password:
    file: ./secrets/mongo_root_password.txt
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  mysql_user_password:
    file: ./secrets/mysql_user_password.txt

volumes:
  mongo_data:
    driver: local
  mysql_data:
